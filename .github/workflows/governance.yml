name: governance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Report protected paths
        # The pre-bootstrap required job used "exit 1"; post-bootstrap this is informational.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          changed_file="$(mktemp)"
          trap 'rm -f "$changed_file"' EXIT
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changed_file"

          protected=false
          while IFS= read -r -d '' path; do
            case "$path" in
              AUTONOMY.md | .autonomy/* | .github/workflows/* | .github/CODEOWNERS | harness/* | \
              .npmrc | package.json | package-lock.json | scripts/bootstrap-verifier-runner.sh | \
              scripts/independent-verifier.mjs | \
              scripts/validate-autonomy.mjs | scripts/validate-harness.mjs | tsconfig.json | \
              tsconfig.build.json | src/agent.ts | src/approval.ts | src/autonomy/cli.ts | \
              src/autonomy/intake.ts | src/autonomy/maintenance.ts | \
              src/autonomy/orchestrator.ts | src/autonomy/roadmap-enforcement.ts | \
              src/autonomy/worker.ts | src/policy.ts | src/tools.ts | src/workspace.ts)
                protected=true
                printf 'Protected governance path changed: %s\n' "$path"
                ;;
            esac
          done < "$changed_file"

          if [[ "$PR_AUTHOR" == "beforeload" && "$protected" == "true" ]]; then
            echo "::warning::beforeload-authored pull request changes protected governance paths."
            echo "This job is informational; the exact-SHA independent verifier enforces approved paths."
          fi

          echo "Protected-path inventory completed for $PR_AUTHOR."
