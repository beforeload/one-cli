name: autonomy-tick

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-tick
  cancel-in-progress: false

env:
  NODE_VERSION: 22.13.0
  CODEBUDDY_VERSION: 2.133.1

jobs:
  select:
    name: select-trusted-issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      base_sha: ${{ steps.select.outputs.base_sha }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install trusted dependencies
        run: npm ci --ignore-scripts
      - name: Select one exact trusted issue
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/github-autonomy.mjs select
          --out "${RUNNER_TEMP}/selection.json"
          --github-output "${GITHUB_OUTPUT}"
      - name: Upload immutable selection
        if: steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomy-selection-${{ github.run_id }}
          path: ${{ runner.temp }}/selection.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: build-without-repository-credentials
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted base without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.select.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install trusted dependencies and pinned agent
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --global "@tencent-ai/codebuddy-code@${CODEBUDDY_VERSION}"
      - name: Download immutable selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autonomy-selection-${{ github.run_id }}
          path: ${{ runner.temp }}/selection
      - name: Validate model configuration
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          CODEBUDDY_MODEL: ${{ vars.CODEBUDDY_MODEL }}
        run: |
          set -euo pipefail
          test -n "${CODEBUDDY_API_KEY:-}" || { echo "::error::Missing CODEBUDDY_API_KEY"; exit 1; }
          test -n "${CODEBUDDY_MODEL:-}" || { echo "::error::Missing CODEBUDDY_MODEL"; exit 1; }
      - name: Generate a bounded change
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          CODEBUDDY_MODEL: ${{ vars.CODEBUDDY_MODEL }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODEBUDDY_INTERNET_ENVIRONMENT }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.codebuddy"
          printf '%s\n' '{"gateway":{"runTimeoutMs":3300000}}' > "${HOME}/.codebuddy/settings.json"
          node scripts/github-autonomy.mjs prompt \
            --selection "${RUNNER_TEMP}/selection/selection.json" \
            --out "${RUNNER_TEMP}/prompt.txt"
          codebuddy -p \
            --model "${CODEBUDDY_MODEL}" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Grep" \
            --settings "${HOME}/.codebuddy/settings.json" \
            "$(<"${RUNNER_TEMP}/prompt.txt")"
      - name: Capture and validate model patch
        run: >-
          node scripts/github-autonomy.mjs capture
          --selection "${RUNNER_TEMP}/selection/selection.json"
          --patch "${RUNNER_TEMP}/change.patch"
          --manifest "${RUNNER_TEMP}/change.json"
      - name: Upload model output as data only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomy-change-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selection/selection.json
            ${{ runner.temp }}/change.patch
            ${{ runner.temp }}/change.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: verify-generated-change
    needs: [select, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted base without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.select.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install trusted dependencies
        run: npm ci --ignore-scripts
      - name: Download model output as untrusted data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autonomy-change-${{ github.run_id }}
          path: ${{ runner.temp }}/change
      - name: Revalidate and apply exact patch
        # github-autonomy.mjs performs git apply --check before applying.
        run: >-
          node scripts/github-autonomy.mjs apply
          --selection "${RUNNER_TEMP}/change/selection/selection.json"
          --patch "${RUNNER_TEMP}/change/change.patch"
          --manifest "${RUNNER_TEMP}/change/change.json"
      - name: Run all repository gates
        run: npm run check
      - name: Upload verified change
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomy-verified-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/change/selection.json
            ${{ runner.temp }}/change/change.patch
            ${{ runner.temp }}/change/change.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-without-model-credentials
    needs: [select, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.ONE_CLI_BOT_APP_ID }}
          private-key: ${{ secrets.ONE_CLI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Check out exact trusted base with publisher credential
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.select.outputs.base_sha }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install trusted dependencies
        run: npm ci --ignore-scripts
      - name: Download verified change only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autonomy-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/verified
      - name: Revalidate verified patch
        run: >-
          node scripts/github-autonomy.mjs apply
          --selection "${RUNNER_TEMP}/verified/selection/selection.json"
          --patch "${RUNNER_TEMP}/verified/change.patch"
          --manifest "${RUNNER_TEMP}/verified/change.json"
      - name: Push branch and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="$(node scripts/github-autonomy.mjs value --selection "${RUNNER_TEMP}/verified/selection.json" --field branch --suffix "-${RUN_ID}")"
          title="$(node scripts/github-autonomy.mjs value --selection "${RUNNER_TEMP}/verified/selection.json" --field title)"
          node scripts/github-autonomy.mjs pr-body \
            --selection "${RUNNER_TEMP}/verified/selection/selection.json" \
            --manifest "${RUNNER_TEMP}/verified/change.json" \
            --out "${RUNNER_TEMP}/pr-body.md"
          git config user.name one-cli-bot[bot]
          git config user.email 234311160+one-cli-bot[bot]@users.noreply.github.com
          git switch --create "${branch}"
          git add --all
          git commit -m "feat: resolve trusted issue"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "feat: ${title}" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
          gh pr merge "${branch}" --auto --merge
