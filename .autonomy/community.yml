    name: Qwen Code
    trust: official-primary
    repository: https://github.com/QwenLM/qwen-code
    releases: https://github.com/QwenLM/qwen-code/releases
    discussions: https://github.com/QwenLM/qwen-code/discussions
    documentation:
      url: https://qwenlm.github.io/qwen-code-docs/en/
      kind: official-documentation
    topics:
      - project-monitoring
      - interactive-coding-agent
      - long-sessions-context
      - extensions-parallelism
      - provider-cost-governance
      - safety-platform-testing-docs
