schema: one-cli.independent-verifier/v4

repository:
  owner: beforeload
  name: one-cli
  defaultBranch: main

workflow:
  path: .github/workflows/independent-verifier.yml
  event: pull_request_target
  runnerLabels:
    - self-hosted
    - macOS
    - one-cli-verifier
  blobSha: e947ad0c33093acc34f3a83aefa6ef26a40225a1
  policyVersion: one-cli.independent-verifier/v4
  policyHash: 6953e9b1f3d3e98458b69cd20a156f896cf261b377686dad205774c2670696e7

requiredChecks:
  - name: verify
    appId: 15368
  - name: one-cli/independent-verifier
    appId: 15368

emittedCheck:
  name: one-cli/independent-verifier
  appId: 15368

reviewIdentity:
  appId: 15368
  actor: github-actions[bot]
  actorId: 41898282

protectedPaths:
  exact:
    - AUTONOMY.md
    - .github/CODEOWNERS
    - .npmrc
    - package.json
    - package-lock.json
    - scripts/bootstrap-verifier-runner.sh
    - scripts/independent-verifier.mjs
    - scripts/validate-autonomy.mjs
    - scripts/validate-harness.mjs
    - tsconfig.json
    - tsconfig.build.json
    - harness/tsconfig.json
  prefixes:
    - .autonomy/
    - .github/workflows/
    - harness/

semanticReview:
  quorum: 2
  baseUrlEnvironment: ONE_CLI_VERIFIER_BASE_URL
  repositoryBaseUrlEnvironment: ONE_CLI_VERIFIER_REPOSITORY_BASE_URL
  defaultBaseUrl: http://127.0.0.1:8085/v1
  apiKey: local-proxy
  profiles:
    - id: verifier-profile-a
      modelEnvironment: ONE_CLI_VERIFIER_MODEL_A
      repositoryModelEnvironment: ONE_CLI_VERIFIER_REPOSITORY_MODEL_A
      defaultModel: claude-opus-4.8
    - id: verifier-profile-b
      modelEnvironment: ONE_CLI_VERIFIER_MODEL_B
      repositoryModelEnvironment: ONE_CLI_VERIFIER_REPOSITORY_MODEL_B
      defaultModel: gpt-5.4

limits:
  maxChangedFiles: 300
  maxDiffBytes: 1048576
  maxModelOutputBytes: 16384
  requestTimeoutMs: 60000
  verifyWaitMs: 1200000

merge:
  enabled: true
  method: merge
